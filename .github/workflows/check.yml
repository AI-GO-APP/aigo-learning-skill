name: Student package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      AIGO_BUILDER_SKILL: ${{ github.workspace }}/.ci/builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AI-GO-APP/aigo-app-builder-skill
          path: .ci/builder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-pdf.txt
      - run: python -m pip install httpx
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_update.py --status
      - run: git diff --exit-code
