name: Student package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-pdf.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_update.py --status
      - run: git diff --exit-code
